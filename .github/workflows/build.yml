name: build

# Builds GFOpenAmigaGCC from scripts/sources.lock with every patch, runs
# build.sh's own checks, the qemu-m68k reproducers, the lean C++ check, and
# compiles the C++ runtime and libpthread tests (they need a real AmigaOS to
# run). The NDK is downloaded at build time (scripts/ndk.lock) and never kept.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish this build as a release, e.g. 16.2.0-open7 (needs docs/releases/<version>.md); empty builds only'
        required: false
        default: ''
      rc:
        description: 'With release: publish it as release candidate N, a pre-release tagged v<release>-rcN (e.g. 1); empty publishes the release itself'
        required: false
        default: ''
      aarch64_rc:
        description: 'Build only the Linux kernel compilers and publish aarch64-linux-gnu as pre-release N, tagged v<version>-aarch64-rcN (e.g. 1)'
        required: false
        default: ''
      x86_64_rc:
        description: 'Build only the Linux kernel compilers and publish x86_64-linux-gnu as pre-release N, tagged v<version>-x86_64-rcN'
        required: false
        default: ''
      powerpc_rc:
        description: 'Build only the Linux kernel compilers and publish powerpc-linux-gnu as pre-release N, tagged v<version>-powerpc-rcN'
        required: false
        default: ''
      x86_64_glibc_rc:
        description: 'Build only the Linux userland compilers and publish x86_64-linux-gnu over glibc 2.35 as pre-release N, tagged v<version>-x86_64-glibc-rcN'
        required: false
        default: ''
      aarch64_glibc_rc:
        description: 'Build only the Linux userland compilers and publish aarch64-linux-gnu over glibc 2.35 as pre-release N, tagged v<version>-aarch64-glibc-rcN'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The build runs third-party sources and this PR's own scripts for hours,
# so its token can only read; publishing is a job of its own, with write,
# that runs none of them.
jobs:
  build:
    if: inputs.aarch64_rc == '' && inputs.x86_64_rc == '' && inputs.powerpc_rc == '' && inputs.x86_64_glibc_rc == '' && inputs.aarch64_glibc_rc == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Room for the release tarballs
        if: inputs.release != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h "$RUNNER_TEMP"

      - name: Folders
        run: |
          echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/prefix" >> "$GITHUB_ENV"
          echo "NDKDIR=$RUNNER_TEMP/ndk" >> "$GITHUB_ENV"

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gperf texinfo install-info \
            libgmp-dev libmpfr-dev libmpc-dev rsync git lhasa autoconf gettext \
            libncurses-dev libreadline-dev qemu-user python3

      - name: The release names check refuses what it should
        run: tests/release-names-test.sh

      - name: Release names agree
        run: tests/release-names.sh "${{ inputs.release }}" "${{ inputs.rc }}"

      - name: Compiler output readers drain their input
        run: python3 tests/compiler-output.py

      - name: Exclusive build work folder
        run: tests/build-lock.sh

      - name: Shared libnix source list
        run: tests/libnix4-source-list.sh

      - name: Fetch sources
        run: scripts/fetch.sh "$WORK"

      - name: Fetch the NDK
        run: scripts/fetch-ndk.sh "$NDKDIR"

      - name: Build
        run: scripts/build.sh "$WORK" "$PREFIX" "$NDKDIR/NDK3.2.lha" "$(nproc)"

      - name: Reproducers under qemu-m68k
        run: |
          tests/repro/prove.sh "$PREFIX/bin"
          tests/repro/prove.sh "$PREFIX/bin" -fno-tree-loop-distribute-patterns

      - name: Optimiser correctness and code-size matrix
        run: OUT="$RUNNER_TEMP/optimizer" tests/optimizer/check.sh "$PREFIX/bin"

      - name: Defined-behaviour optimiser differential fuzzing
        run: OUT="$RUNNER_TEMP/optimizer-fuzz" python3 tests/optimizer/fuzz.py "$PREFIX/bin" 12

      - name: UBSan trap checks without a sanitizer runtime
        run: OUT="$RUNNER_TEMP/ubsan-trap" python3 tests/ubsan-trap/check.py "$PREFIX/bin"

      - name: Keep UBSan trap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubsan-trap-evidence
          path: ${{ runner.temp }}/ubsan-trap/

      - name: PR123853 (patches/gcc/0013) for m68k-amigaos, with the autoinc scanner
        run: tests/autoinc/check.sh --amigaos "$PREFIX/bin"

      - name: Built libnix end-pointer control under qemu-m68k
        run: tests/libnix/endptr/run.sh "$PREFIX/bin"

      - name: Lean C++ check
        run: CXX="$PREFIX/bin/m68k-amigaos-g++" NM="$PREFIX/bin/m68k-amigaos-nm" tests/cxx/lean-check.sh

      - name: Base-relative C++ exception data
        run: tests/baserel/eh-check.sh "$PREFIX"

      - name: Dedicated 68040 AmigaOS multilibs
        run: tests/amigaos-multilib.sh "$PREFIX"

      - name: Compile the AmigaOS-only tests
        run: |
          set -e
          O=$RUNNER_TEMP/amiga-tests; mkdir -p "$O"
          CXX="$PREFIX/bin/m68k-amigaos-g++"
          FL="-m68040 -m68881 -O2 -fomit-frame-pointer -std=gnu++23"
          $CXX $FL -o "$O/dtors" tests/cxx/dtors.cpp -lpthread
          for t in tests/pthreads/*.cpp; do
            $CXX $FL -o "$O/$(basename "$t" .cpp)" "$t" -lpthread -latomic -lstdc++
          done
          "$PREFIX/bin/m68k-amigaos-gcc" -m68040 -m68881 -O2 -o "$O/setlocale_threads" tests/libnix/setlocale_threads.c -lpthread -lm
          "$PREFIX/bin/m68k-amigaos-gcc" -m68040 -O2 -noixemul -o "$O/foreigntls" tests/pthreads/foreigntls.c -lpthread
          "$PREFIX/bin/m68k-amigaos-gcc" -m68040 -O2 -Wall -Werror -noixemul -o "$O/condsignal" tests/pthreads/condsignal.c -lpthread
          # std::stoll, std::stoull, std::stold (#51): the release needs the C99 stdlib on, so a build where
          # scripts/libstdcxx-c99-stdlib.sh turned it back off fails here; linked, as a port links it
          $CXX $FL -o "$O/stoll" tests/cxx/stoll.cpp -lpthread
          $CXX -m68040 -O2 -std=gnu++11 -o "$O/stoll-soft" tests/cxx/stoll.cpp -lpthread
          "$PREFIX/bin/m68k-amigaos-gcc" -m68040 -m68881 -O2 -o "$O/strtol_endptr" tests/libnix/strtol_endptr.c
          ls -l "$O"

      - name: Package
        if: inputs.release != ''
        run: |
          test -f "docs/releases/${{ inputs.release }}.md"
          scripts/package.sh "$WORK" "$PREFIX" "$RUNNER_TEMP/out" "${{ inputs.release }}"
          ls -l "$RUNNER_TEMP/out"

      - name: Keep the release files for the release job
        if: inputs.release != ''
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ${{ env.WORK }}/gfopenamigagcc-logs
            ${{ env.WORK }}/log

  # The m68k-aros target (from open6): stock GCC 16.2.0 with patches/aros/series.
  # No AROS SDK here (it comes from an AROS build), so the compiler, binutils and
  # collect-aros are built and the code checks compile and assemble only; the
  # stove build on the Cradle machine adds libgcc, libstdc++ and libatomic.
  aros:
    if: inputs.aarch64_rc == '' && inputs.x86_64_rc == '' && inputs.powerpc_rc == '' && inputs.x86_64_glibc_rc == '' && inputs.aarch64_glibc_rc == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev git curl python3

      - name: Every GCC patch decided for m68k-aros
        run: tests/aros-series.sh

      - name: Fetch the m68k-aros sources
        run: scripts/fetch-aros.sh "$RUNNER_TEMP/work"

      - name: Build m68k-aros-gcc (compiler, binutils, collect-aros)
        run: scripts/build-aros.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/aros" none "$(nproc)"

      - name: PR123853 (patches/gcc/0013) for m68k-aros, with the autoinc scanner
        run: tests/autoinc/check.sh --aros "$RUNNER_TEMP/aros"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aros-logs
          path: ${{ runner.temp }}/work/aros/logs

  # The Linux kernel compilers (from open9): stock GCC 16.2.0 and binutils 2.47
  # with patches/linux/series, C and libgcc only, one per architecture.
  linux:
    if: inputs.x86_64_glibc_rc == '' && inputs.aarch64_glibc_rc == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64, powerpc]
    env:
      ARCH: ${{ matrix.arch }}
      RC: ${{ inputs[format('{0}_rc', matrix.arch)] }}
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev rsync curl qemu-user python3

      - name: The Linux recipe check refuses what it should
        run: tests/linux-recipe-test.sh

      - name: Fetch the sources
        run: scripts/fetch-linux.sh "$RUNNER_TEMP/work"

      - name: Build ${{ matrix.arch }}-linux-gnu-gcc (checks included)
        run: scripts/build-linux.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/linux" "$ARCH" "$(nproc)"

      - name: Package
        if: env.RC != ''
        run: |
          V=$(sed -n 's/^ID="GFOpenAmigaGCC \(.*\)"$/\1/p' scripts/build-linux.sh)
          test -f "docs/releases/$V-$ARCH.md"
          scripts/package-linux.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/linux" "$RUNNER_TEMP/out" "$V" "$ARCH"
          echo "$V" > "$RUNNER_TEMP/out/VERSION"
          ls -l "$RUNNER_TEMP/out"

      - name: Keep the release files for the release job
        if: env.RC != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-logs
          path: ${{ runner.temp }}/work/linux/logs-${{ matrix.arch }}

  linux-release:
    needs: [linux]
    if: inputs.aarch64_rc != '' || inputs.x86_64_rc != '' || inputs.powerpc_rc != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64, powerpc]
    env:
      ARCH: ${{ matrix.arch }}
      RC: ${{ inputs[format('{0}_rc', matrix.arch)] }}
    steps:
      - uses: actions/checkout@v4
        if: env.RC != ''
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: env.RC != ''
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/out

      - name: Publish the pre-release
        if: env.RC != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $RC =~ ^[1-9][0-9]*$ ]] || { echo "${ARCH}_rc \"$RC\" is not a number from 1"; exit 1; }
          V=$(cat "$RUNNER_TEMP/out/VERSION")
          cd "$RUNNER_TEMP/out" && sha256sum -c "SHA256SUMS-$ARCH" && cd "$GITHUB_WORKSPACE"
          gh release create "v$V-$ARCH-rc$RC" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "GFOpenAmigaGCC $V for $ARCH-linux-gnu RC$RC" --notes-file "docs/releases/$V-$ARCH.md" \
            "$RUNNER_TEMP/out/gfopenamigagcc-$V-$ARCH-linux-gnu-x86_64-linux.tar.xz" \
            "$RUNNER_TEMP/out/gfopenamigagcc-$V-$ARCH-linux-gnu-src.tar" "$RUNNER_TEMP/out/SHA256SUMS-$ARCH"

  # The Linux userland compilers (from open9): stock GCC 16.2.0 and binutils 2.47
  # with patches/linux/series, C and C++, over a glibc 2.35 and Linux 5.15 sysroot,
  # for the native runtimes AmiCradle builds (gfosmotherboards ci/build_runtimes.py).
  userland:
    if: inputs.aarch64_rc == '' && inputs.x86_64_rc == '' && inputs.powerpc_rc == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
      RC: ${{ inputs[format('{0}_glibc_rc', matrix.arch)] }}
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex texinfo gawk rsync libgmp-dev libmpfr-dev libmpc-dev curl qemu-user python3

      - name: The userland recipe check refuses what it should
        run: tests/userland-recipe-test.sh

      - name: Fetch the sources
        run: scripts/fetch-userland.sh "$RUNNER_TEMP/work"

      - name: Build ${{ matrix.arch }}-linux-gnu-gcc and g++ over glibc 2.35 (checks included)
        run: scripts/build-userland.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/userland" "$ARCH" "$(nproc)"

      - name: Package
        if: env.RC != ''
        run: |
          V=$(sed -n 's/^ID="GFOpenAmigaGCC \(.*\)"$/\1/p' scripts/build-userland.sh)
          test -f "docs/releases/$V-$ARCH-glibc.md"
          scripts/package-userland.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/userland" "$RUNNER_TEMP/out" "$V" "$ARCH"
          echo "$V" > "$RUNNER_TEMP/out/VERSION"
          ls -l "$RUNNER_TEMP/out"

      - name: Keep the release files for the release job
        if: env.RC != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}-glibc
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: userland-${{ matrix.arch }}-logs
          path: ${{ runner.temp }}/work/userland/logs-${{ matrix.arch }}

  userland-release:
    needs: [userland]
    if: inputs.x86_64_glibc_rc != '' || inputs.aarch64_glibc_rc != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
      RC: ${{ inputs[format('{0}_glibc_rc', matrix.arch)] }}
    steps:
      - uses: actions/checkout@v4
        if: env.RC != ''
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: env.RC != ''
        with:
          name: release-${{ matrix.arch }}-glibc
          path: ${{ runner.temp }}/out

      - name: Publish the pre-release
        if: env.RC != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $RC =~ ^[1-9][0-9]*$ ]] || { echo "${ARCH}_glibc_rc \"$RC\" is not a number from 1"; exit 1; }
          V=$(cat "$RUNNER_TEMP/out/VERSION")
          cd "$RUNNER_TEMP/out" && sha256sum -c "SHA256SUMS-$ARCH-glibc" && cd "$GITHUB_WORKSPACE"
          gh release create "v$V-$ARCH-glibc-rc$RC" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "GFOpenAmigaGCC $V for $ARCH-linux-gnu, glibc 2.35, RC$RC" --notes-file "docs/releases/$V-$ARCH-glibc.md" \
            "$RUNNER_TEMP/out/gfopenamigagcc-$V-$ARCH-linux-gnu-glibc2.35-x86_64-linux.tar.xz" \
            "$RUNNER_TEMP/out/gfopenamigagcc-$V-$ARCH-linux-gnu-glibc2.35-src.tar" "$RUNNER_TEMP/out/SHA256SUMS-$ARCH-glibc"

  release:
    needs: [build, aros]
    if: inputs.release != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.release }}
          RC: ${{ inputs.rc }}
        run: |
          cd "$RUNNER_TEMP/out" && sha256sum -c SHA256SUMS && cd "$GITHUB_WORKSPACE"
          # A release candidate is a pre-release of the same build: tag v$V-rcN, the files keep the
          # release's names (the compiler says $V), so the release itself can be the same bytes.
          TAG="v$V"; TITLE="GFOpenAmigaGCC $V"; PRE=()
          if [ -n "$RC" ]; then TAG="v$V-rc$RC"; TITLE="GFOpenAmigaGCC $V RC$RC"; PRE=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${PRE[@]}" \
            --title "$TITLE" --notes-file "docs/releases/$V.md" \
            "$RUNNER_TEMP/out/gfopenamigagcc-$V-x86_64-linux.tar.xz" \
            "$RUNNER_TEMP/out/gfopenamigagcc-$V-src.tar.xz" "$RUNNER_TEMP/out/SHA256SUMS"
